[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exobalancelab"
version = "0.1.0"
description = "MATLAB-to-MuJoCo tools and reproducible human-exoskeleton standing balance experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.3.7", "numpy==2.2.6", "scipy==1.15.3", "matplotlib==3.10.3",
  "PyYAML==6.0.2", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "pillow==11.2.1",
  "h5py==3.14.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.0"]
hjb = [
  "jax[cuda13]==0.12.0.1", "flax==0.12.10",
  "hj-reachability @ git+https://github.com/StanfordASL/hj_reachability.git@9aebaf97440672e18b6e205cbf1d947a44f41079",
]

[project.scripts]
exobalance = "exobalancelab.cli:main"

[tool.setuptools.packages.find]
include = ["exobalancelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
