name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mechanics-and-interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check exobalancelab tests examples
      - run: ruff format --check exobalancelab tests examples
      - run: pytest -q
